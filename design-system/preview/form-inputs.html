<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Form Inputs — SonoInjection</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #f7f9fc; padding: 20px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; align-items: flex-start; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 180px; }
  label { font-size: 11px; font-weight: 600; color: #374151; }
  input, select, textarea {
    font-family: 'DM Sans', sans-serif; font-size: 14px; color: #0c1b33;
    background: #fff; border: 1.5px solid #e5e7eb; border-radius: 8px;
    padding: 9px 12px; outline: none; transition: border-color 150ms ease;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus { border-color: #0aada8; box-shadow: 0 0 0 3px rgba(10,173,168,0.12); }
  .input-error { border-color: #dc2626 !important; }
  .input-disabled { background: #f3f4f6; color: #9ca3af; cursor: not-allowed; }
  .helper { font-size: 11px; color: #6b7280; }
  .helper-error { font-size: 11px; color: #dc2626; }
  textarea { resize: none; height: 64px; }
  .search { position: relative; }
  .search input { padding-left: 32px; }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #9ca3af; font-size: 14px; }
  .divider { width: 100%; border: none; border-top: 1px solid #e5e7eb; margin: 4px 0; }
</style>
</head>
<body>
  <div class="row">
    <div class="field">
      <label>Full Name</label>
      <input type="text" placeholder="Dr. Anna Schmidt" value="">
      <span class="helper">As it appears on your medical license</span>
    </div>
    <div class="field">
      <label>Email Address</label>
      <input type="email" placeholder="anna@clinic.de" class="">
    </div>
    <div class="field search">
      <label>Search Courses</label>
      <span class="search-icon">⌕</span>
      <input type="search" placeholder="Shoulder, knee, hip…">
    </div>
  </div>
  <hr class="divider">
  <div class="row">
    <div class="field">
      <label>Specialty</label>
      <select>
        <option>Physical Medicine & Rehabilitation</option>
        <option>Orthopedic Surgery</option>
        <option>Physiotherapy</option>
      </select>
    </div>
    <div class="field">
      <label>Registration Code <span style="color:#dc2626">*</span></label>
      <input type="text" placeholder="SonoInjection-2025-…" class="input-error">
      <span class="helper-error">Invalid registration code</span>
    </div>
    <div class="field">
      <label>Disabled Field</label>
      <input type="text" value="Read only value" class="input-disabled" disabled>
    </div>
  </div>
  <hr class="divider">
  <div class="row">
    <div class="field" style="min-width:300px">
      <label>Notes for Faculty</label>
      <textarea placeholder="Any prior experience, accessibility needs, etc."></textarea>
      <span class="helper">Optional — read by course coordinator only</span>
    </div>
  </div>
</body>
</html>
