<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neutral Colors — SonoInjection</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #f7f9fc; padding: 20px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .swatch { flex: 1; border-radius: 8px; overflow: hidden; }
  .swatch-color { height: 52px; }
  .swatch-info { padding: 6px 8px; background: #fff; border: 1px solid #e5e7eb; border-top: none; border-radius: 0 0 8px 8px; }
  .swatch-name { font-size: 11px; font-weight: 600; color: #374151; font-family: 'Space Grotesk', sans-serif; }
  .swatch-hex  { font-size: 10px; color: #6b7280; font-family: 'JetBrains Mono', monospace; }
  .section-label { font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #9ca3af; margin-bottom: 6px; margin-top: 12px; }
</style>
</head>
<body>
<div class="section-label">Slate — Neutral Scale</div>
<div class="row">
  <div class="swatch"><div class="swatch-color" style="background:#090d14"></div><div class="swatch-info"><div class="swatch-name">950</div><div class="swatch-hex">#090d14</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#111827"></div><div class="swatch-info"><div class="swatch-name">900</div><div class="swatch-hex">#111827</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#1f2937"></div><div class="swatch-info"><div class="swatch-name">800</div><div class="swatch-hex">#1f2937</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#374151"></div><div class="swatch-info"><div class="swatch-name">700</div><div class="swatch-hex">#374151</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#4b5563"></div><div class="swatch-info"><div class="swatch-name">600</div><div class="swatch-hex">#4b5563</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#6b7280"></div><div class="swatch-info"><div class="swatch-name">500</div><div class="swatch-hex">#6b7280</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#9ca3af"></div><div class="swatch-info"><div class="swatch-name">400</div><div class="swatch-hex">#9ca3af</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#d1d5db; border:1px solid #e5e7eb;"></div><div class="swatch-info"><div class="swatch-name">300</div><div class="swatch-hex">#d1d5db</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#e5e7eb; border:1px solid #e5e7eb;"></div><div class="swatch-info"><div class="swatch-name">200</div><div class="swatch-hex">#e5e7eb</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#f3f4f6; border:1px solid #e5e7eb;"></div><div class="swatch-info"><div class="swatch-name">100</div><div class="swatch-hex">#f3f4f6</div></div></div>
  <div class="swatch"><div class="swatch-color" style="background:#f9fafb; border:1px solid #e5e7eb;"></div><div class="swatch-info"><div class="swatch-name">50</div><div class="swatch-hex">#f9fafb</div></div></div>
</div>
</body>
</html>
