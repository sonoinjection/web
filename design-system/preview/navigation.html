<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Navigation — SonoInjection</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #eef1f6; }
  /* Light Nav */
  .nav { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 60px; box-shadow: 0 1px 4px rgba(12,27,51,0.06); }
  .nav-logo { display: flex; align-items: center; gap: 10px; }
  .nav-mark { display: flex; align-items: center; gap: 4px; }
  .nav-mark span { width: 3px; border-radius: 2px; background: #0aada8; }
  .nav-wordmark { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; color: #0c1b33; letter-spacing: -0.02em; }
  .nav-links { display: flex; gap: 28px; }
  .nav-link { font-size: 14px; font-weight: 500; color: #4b5563; text-decoration: none; }
  .nav-link.active { color: #0aada8; }
  .nav-actions { display: flex; gap: 10px; align-items: center; }
  .nav-btn { background: #0aada8; color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; }
  /* Dark Nav */
  .nav-dark { background: #0c1b33; border-bottom: 1px solid rgba(255,255,255,0.08); padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 60px; margin-top: 12px; }
  .nav-dark .nav-wordmark { color: #fff; }
  .nav-dark .nav-link { color: rgba(255,255,255,0.6); }
  .nav-dark .nav-link.active { color: #0aada8; }
  .spacer { height: 12px; }
</style>
</head>
<body>
  <!-- Light -->
  <nav class="nav">
    <div class="nav-logo">
      <div class="nav-mark">
        <span style="height:12px"></span>
        <span style="height:20px"></span>
        <span style="height:26px"></span>
        <span style="height:20px"></span>
        <span style="height:12px"></span>
      </div>
      <div class="nav-wordmark">SonoInjection</div>
    </div>
    <div class="nav-links">
      <a class="nav-link active" href="#">Courses</a>
      <a class="nav-link" href="#">Faculty</a>
      <a class="nav-link" href="#">About</a>
      <a class="nav-link" href="#">Contact</a>
    </div>
    <div class="nav-actions">
      <a class="nav-link" href="#">Sign In</a>
      <button class="nav-btn">Register Now</button>
    </div>
  </nav>
  <!-- Dark -->
  <nav class="nav-dark">
    <div class="nav-logo">
      <div class="nav-mark">
        <span style="height:12px;width:3px;border-radius:2px;background:#0aada8;display:inline-block;"></span>
        <span style="height:20px;width:3px;border-radius:2px;background:#0aada8;display:inline-block;margin:0 3px;"></span>
        <span style="height:26px;width:3px;border-radius:2px;background:#0aada8;display:inline-block;"></span>
        <span style="height:20px;width:3px;border-radius:2px;background:#0aada8;display:inline-block;margin:0 3px;"></span>
        <span style="height:12px;width:3px;border-radius:2px;background:#0aada8;display:inline-block;"></span>
      </div>
      <div class="nav-wordmark" style="color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;letter-spacing:-0.02em;margin-left:10px;">SonoInjection</div>
    </div>
    <div class="nav-links">
      <a class="nav-link active" href="#" style="color:#0aada8;font-size:14px;font-weight:500;text-decoration:none;">Courses</a>
      <a class="nav-link" href="#" style="color:rgba(255,255,255,0.6);font-size:14px;font-weight:500;text-decoration:none;">Faculty</a>
      <a class="nav-link" href="#" style="color:rgba(255,255,255,0.6);font-size:14px;font-weight:500;text-decoration:none;">About</a>
      <a class="nav-link" href="#" style="color:rgba(255,255,255,0.6);font-size:14px;font-weight:500;text-decoration:none;">Contact</a>
    </div>
    <div class="nav-actions">
      <a href="#" style="color:rgba(255,255,255,0.6);font-size:14px;font-weight:500;text-decoration:none;margin-right:6px;">Sign In</a>
      <button class="nav-btn">Register Now</button>
    </div>
  </nav>
</body>
</html>
