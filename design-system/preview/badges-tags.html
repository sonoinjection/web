<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Badges & Tags — SonoInjection</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #f7f9fc; padding: 20px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #e5e7eb; }
  .row:last-child { border-bottom: none; }
  .label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #9ca3af; width: 70px; flex-shrink: 0; }
  .badge { display: inline-flex; align-items: center; border-radius: 999px; font-size: 11px; font-weight: 600; padding: 3px 10px; }
  .tag   { display: inline-flex; align-items: center; border-radius: 6px; font-size: 11px; font-weight: 500; padding: 4px 10px; }
  .b-teal   { background: #edfafa; color: #0aada8; border: 1px solid #bef5f3; }
  .b-navy   { background: #dde6f5; color: #0c1b33; border: 1px solid #beccec; }
  .b-amber  { background: #fdf1e0; color: #b8660e; border: 1px solid #fae4bf; }
  .b-success{ background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; }
  .b-error  { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
  .b-neutral{ background: #f3f4f6; color: #4b5563; border: 1px solid #e5e7eb; }
  .b-dark   { background: #0c1b33; color: #fff; }
  .b-brand  { background: #0aada8; color: #fff; }
</style>
</head>
<body>
  <div class="row"><div class="label">Badges</div>
    <span class="badge b-teal">Ultrasound</span>
    <span class="badge b-navy">PM&amp;R</span>
    <span class="badge b-amber">CME Accredited</span>
    <span class="badge b-success">Open</span>
    <span class="badge b-error">Full</span>
    <span class="badge b-neutral">On-site</span>
    <span class="badge b-dark">Advanced</span>
    <span class="badge b-brand">Featured</span>
  </div>
  <div class="row"><div class="label">Tags</div>
    <span class="tag b-teal">Shoulder</span>
    <span class="tag b-teal">Elbow</span>
    <span class="tag b-teal">Hip</span>
    <span class="tag b-teal">Knee</span>
    <span class="tag b-teal">Ankle</span>
    <span class="tag b-neutral">Wrist</span>
    <span class="tag b-neutral">Soft Tissue</span>
  </div>
  <div class="row"><div class="label">Status</div>
    <span class="badge b-success">● Confirmed</span>
    <span class="badge b-amber">● Waitlist</span>
    <span class="badge b-error">● Cancelled</span>
    <span class="badge b-neutral">● Draft</span>
  </div>
</body>
</html>
