<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buttons — SonoInjection</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #f7f9fc; padding: 20px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #e5e7eb; }
  .row:last-child { border-bottom: none; }
  .label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #9ca3af; width: 80px; flex-shrink: 0; }
  button { font-family: 'DM Sans', sans-serif; font-weight: 600; border: none; cursor: pointer; transition: all 200ms ease; border-radius: 8px; }
  .btn-primary        { background: #0aada8; color: #fff; padding: 10px 20px; font-size: 14px; }
  .btn-primary:hover  { background: #0c9898; }
  .btn-secondary      { background: #0c1b33; color: #fff; padding: 10px 20px; font-size: 14px; }
  .btn-secondary:hover{ background: #122347; }
  .btn-outline        { background: transparent; color: #0aada8; border: 1.5px solid #0aada8; padding: 9px 19px; font-size: 14px; }
  .btn-outline:hover  { background: #edfafa; }
  .btn-ghost          { background: transparent; color: #0c1b33; padding: 10px 20px; font-size: 14px; }
  .btn-ghost:hover    { background: #f3f4f6; }
  .btn-accent         { background: #e8a84a; color: #0c1b33; padding: 10px 20px; font-size: 14px; }
  .btn-accent:hover   { background: #d47e18; color: #fff; }
  .btn-danger         { background: #dc2626; color: #fff; padding: 10px 20px; font-size: 14px; }
  .btn-sm  { padding: 6px 14px; font-size: 12px; border-radius: 6px; background: #0aada8; color: #fff; }
  .btn-lg  { padding: 14px 28px; font-size: 16px; border-radius: 10px; background: #0aada8; color: #fff; }
  .btn-disabled { background: #e5e7eb; color: #9ca3af; padding: 10px 20px; font-size: 14px; cursor: not-allowed; }
  .btn-icon { background: #0aada8; color: #fff; padding: 10px; border-radius: 8px; font-size: 14px; line-height: 1; display: inline-flex; align-items: center; gap: 8px; }
</style>
</head>
<body>
  <div class="row"><div class="label">Variants</div>
    <button class="btn-primary">Register Now</button>
    <button class="btn-secondary">Learn More</button>
    <button class="btn-outline">View Schedule</button>
    <button class="btn-ghost">Cancel</button>
    <button class="btn-accent">Enroll Today</button>
    <button class="btn-danger">Remove</button>
  </div>
  <div class="row"><div class="label">Sizes</div>
    <button class="btn-sm">Small</button>
    <button class="btn-primary">Default</button>
    <button class="btn-lg">Large</button>
  </div>
  <div class="row"><div class="label">States</div>
    <button class="btn-primary">Active</button>
    <button class="btn-disabled" disabled>Disabled</button>
    <button class="btn-icon">↗ Apply Now</button>
  </div>
</body>
</html>
