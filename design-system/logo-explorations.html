<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo Explorations — SonoInjection</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>* { margin:0; padding:0; box-sizing:border-box; }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const TEAL = '#0aada8';
const NAVY = '#0c1b33';
const AMBER = '#e8a84a';
const WHITE = '#fff';

/* ─────────────────────────────────────────────
   LOGO MARKS
───────────────────────────────────────────── */

/* A — Classic Refined — waves only */
function LogoA({ bg = WHITE, wave = TEAL, needle = AMBER, word = NAVY }) {
  return (
    <svg viewBox="0 0 96 44" width="192" height="88" fill="none" xmlns="http://www.w3.org/2000/svg">
      {/* Wave bars */}
      <rect x="0"  y="16" width="4" height="12" rx="2" fill={wave}/>
      <rect x="7"  y="9"  width="4" height="26" rx="2" fill={wave}/>
      <rect x="14" y="4"  width="4" height="36" rx="2" fill={wave}/>
      <rect x="21" y="9"  width="4" height="26" rx="2" fill={wave}/>
      <rect x="28" y="16" width="4" height="12" rx="2" fill={wave}/>
      {/* Wordmark */}
      <text x="0" y="42" fontFamily="'Space Grotesk',sans-serif" fontWeight="700" fontSize="13" fill={word} letterSpacing="-0.3">SonoInjection</text>
    </svg>
  );
}

/* B — Wave Spread
   5 bars with varying heights, slightly wider spacing */
function LogoB({ bg = WHITE, wave = TEAL, needle = AMBER, word = NAVY }) {
  return (
    <svg viewBox="0 0 96 44" width="192" height="88" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="0"  y="16" width="4" height="12" rx="2" fill={wave}/>
      <rect x="7"  y="9"  width="4" height="26" rx="2" fill={wave}/>
      <rect x="14" y="4"  width="4" height="36" rx="2" fill={wave}/>
      <rect x="21" y="9"  width="4" height="26" rx="2" fill={wave}/>
      <rect x="28" y="16" width="4" height="12" rx="2" fill={wave}/>
      <text x="0" y="42" fontFamily="'Space Grotesk',sans-serif" fontWeight="700" fontSize="13" fill={word} letterSpacing="-0.3">SonoInjection</text>
    </svg>
  );
}

/* C — Waves only, 5 bars uniform */
function LogoC({ bg = WHITE, wave = TEAL, needle = AMBER, word = NAVY }) {
  return (
    <svg viewBox="0 0 96 44" width="192" height="88" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="0"  y="16" width="4" height="12" rx="2" fill={wave}/>
      <rect x="7"  y="9"  width="4" height="26" rx="2" fill={wave}/>
      <rect x="14" y="4"  width="4" height="36" rx="2" fill={wave}/>
      <rect x="21" y="9"  width="4" height="26" rx="2" fill={wave}/>
      <rect x="28" y="16" width="4" height="12" rx="2" fill={wave}/>
      <text x="0" y="42" fontFamily="'Space Grotesk',sans-serif" fontWeight="700" fontSize="13" fill={word} letterSpacing="-0.3">SonoInjection</text>
    </svg>
  );
}

/* D — Waves only, slightly taller centre */
function LogoD({ bg = WHITE, wave = TEAL, needle = AMBER, word = NAVY }) {
  return (
    <svg viewBox="0 0 96 44" width="192" height="88" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="0"  y="14" width="4" height="12" rx="2" fill={wave}/>
      <rect x="7"  y="7"  width="4" height="26" rx="2" fill={wave}/>
      <rect x="14" y="2"  width="4" height="36" rx="2" fill={wave}/>
      <rect x="21" y="7"  width="4" height="26" rx="2" fill={wave}/>
      <rect x="28" y="14" width="4" height="12" rx="2" fill={wave}/>
      <text x="0" y="42" fontFamily="'Space Grotesk',sans-serif" fontWeight="700" fontSize="13" fill={word} letterSpacing="-0.3">SonoInjection</text>
    </svg>
  );
}

/* E — Radial Fan — waves only */
function LogoE({ bg = WHITE, wave = TEAL, needle = AMBER, word = NAVY }) {
  const origin = [8, 40];
  const angles = [-62, -52, -42, -32, -22];
  const len = [22, 28, 32, 28, 22];
  const bars = angles.map((a, i) => {
    const rad = (a * Math.PI) / 180;
    return {
      x1: origin[0], y1: origin[1],
      x2: origin[0] + Math.sin(rad) * len[i],
      y2: origin[1] - Math.cos(rad) * len[i],
    };
  });
  return (
    <svg viewBox="0 0 96 44" width="192" height="88" fill="none" xmlns="http://www.w3.org/2000/svg">
      {bars.map((b, i) => (
        <line key={i} x1={b.x1} y1={b.y1} x2={b.x2} y2={b.y2} stroke={wave} strokeWidth="3.5" strokeLinecap="round"/>
      ))}
      <circle cx={origin[0]} cy={origin[1]} r="2.5" fill={wave}/>
      <text x="0" y="42" fontFamily="'Space Grotesk',sans-serif" fontWeight="700" fontSize="13" fill={word} letterSpacing="-0.3">SonoInjection</text>
    </svg>
  );
}

/* F — Waves only, all 5 bars uniform teal */
function LogoF({ bg = WHITE, wave = TEAL, needle = AMBER, word = NAVY }) {
  return (
    <svg viewBox="0 0 96 44" width="192" height="88" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="0"  y="16" width="4" height="12" rx="2" fill={wave}/>
      <rect x="7"  y="9"  width="4" height="26" rx="2" fill={wave}/>
      <rect x="14" y="4"  width="4" height="36" rx="2" fill={wave}/>
      <rect x="21" y="9"  width="4" height="26" rx="2" fill={wave}/>
      <rect x="28" y="16" width="4" height="12" rx="2" fill={wave}/>
      <text x="0" y="42" fontFamily="'Space Grotesk',sans-serif" fontWeight="700" fontSize="13" fill={word} letterSpacing="-0.3">SonoInjection</text>
    </svg>
  );
}

/* ─────────────────────────────────────────────
   LOGO CARD — shows light + dark + colour BG
───────────────────────────────────────────── */
function LogoCard({ LogoComponent, label, description }) {
  return (
    <div style={{ fontFamily: "'DM Sans',sans-serif" }}>
      {/* Label */}
      <div style={{ marginBottom: 16 }}>
        <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 15, fontWeight: 700, color: NAVY, marginBottom: 4 }}>{label}</div>
        <div style={{ fontSize: 12, color: '#6b7280', lineHeight: 1.5, maxWidth: 320 }}>{description}</div>
      </div>
      {/* Three colourway previews */}
      <div style={{ display: 'flex', gap: 12 }}>
        {/* Light */}
        <div style={{ background: '#f7f9fc', border: '1px solid #e5e7eb', borderRadius: 12, padding: '24px 28px', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 1 }}>
          <LogoComponent bg="#f7f9fc" wave={TEAL} needle={AMBER} word={NAVY} />
        </div>
        {/* Dark */}
        <div style={{ background: NAVY, borderRadius: 12, padding: '24px 28px', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 1 }}>
          <LogoComponent bg={NAVY} wave={TEAL} needle={AMBER} word={WHITE} />
        </div>
        {/* Teal */}
        <div style={{ background: TEAL, borderRadius: 12, padding: '24px 28px', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 1 }}>
          <LogoComponent bg={TEAL} wave={WHITE} needle={WHITE} word={WHITE} />
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   APP
───────────────────────────────────────────── */
const options = [
  { Logo: LogoA, id:'A', label:'A — Standard', description:'Five rounded bars in a classic bell-curve envelope. Balanced and legible at all sizes.' },
  { Logo: LogoB, id:'B', label:'B — Wide Spread', description:'Same five-bar form with identical proportions — a clean, symmetrical wave mark.' },
  { Logo: LogoC, id:'C', label:'C — Uniform', description:'Five equal-spaced bars with a pronounced centre peak. Clean and highly geometric.' },
  { Logo: LogoD, id:'D', label:'D — Tall Peak', description:'Slightly taller centre bar with compressed flanks — a sharper, more energetic wave silhouette.' },
  { Logo: LogoE, id:'E', label:'E — Radial Fan', description:'Bars fan outward from a focal point, evoking an ultrasound beam. Most abstract and dynamic.' },
  { Logo: LogoF, id:'F', label:'F — Symmetrical', description:'Perfectly mirrored five-bar mark. The simplest, most versatile form of the wave motif.' },
];

function App() {
  const DCCanvas = window.DesignCanvas;
  const DCSection = window.DCSection;
  const DCArtboard = window.DCArtboard;
  return (
    <DCCanvas title="SonoInjection — Logo Explorations">
      <DCSection id="concepts" title="Mark + Wordmark Concepts">
        {options.map(({ Logo, id, label, description }) => (
          <DCArtboard key={id} id={id} label={label} width={740} height={230}>
            <LogoCard LogoComponent={Logo} label={label} description={description} />
          </DCArtboard>
        ))}
      </DCSection>

      <DCSection id="dark-bg" title="Mark Only — Dark Background">
        {options.map(({ Logo, id }) => (
          <DCArtboard key={id} id={`${id}-dark`} label={`Option ${id}`} width={160} height={100}>
            <div style={{ background: NAVY, width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', borderRadius: 8 }}>
              <svg viewBox="0 0 36 44" width="72" height="88" fill="none" xmlns="http://www.w3.org/2000/svg">
                {(id === 'A' || id === 'B' || id === 'C' || id === 'F') && <>
                  <rect x="0"  y="16" width="4" height="12" rx="2" fill={TEAL}/>
                  <rect x="7"  y="9"  width="4" height="26" rx="2" fill={TEAL}/>
                  <rect x="14" y="4"  width="4" height="36" rx="2" fill={TEAL}/>
                  <rect x="21" y="9"  width="4" height="26" rx="2" fill={TEAL}/>
                  <rect x="28" y="16" width="4" height="12" rx="2" fill={TEAL}/>
                </>}
                {id === 'D' && <>
                  <rect x="0"  y="14" width="4" height="12" rx="2" fill={TEAL}/>
                  <rect x="7"  y="7"  width="4" height="26" rx="2" fill={TEAL}/>
                  <rect x="14" y="2"  width="4" height="36" rx="2" fill={TEAL}/>
                  <rect x="21" y="7"  width="4" height="26" rx="2" fill={TEAL}/>
                  <rect x="28" y="14" width="4" height="12" rx="2" fill={TEAL}/>
                </>}
                {id === 'E' && (() => {
                  const origin = [8, 40]; const angles = [-62,-52,-42,-32,-22]; const len=[22,28,32,28,22];
                  const bars = angles.map((a,i)=>{const r=(a*Math.PI)/180;return{x2:origin[0]+Math.sin(r)*len[i],y2:origin[1]-Math.cos(r)*len[i]};});
                  return (<>
                    {bars.map((b,i)=><line key={i} x1={origin[0]} y1={origin[1]} x2={b.x2} y2={b.y2} stroke={TEAL} strokeWidth="3.5" strokeLinecap="round"/>)}
                    <circle cx={origin[0]} cy={origin[1]} r="2.5" fill={TEAL}/>
                  </>);
                })()}
              </svg>
            </div>
          </DCArtboard>
        ))}
      </DCSection>
    </DCCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
