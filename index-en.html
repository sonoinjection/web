<style>

  border: '#e5e7eb', border2: '#d1d5db',
  success: '#16a34a', successBg: '#dcfce7',

/* ── COURSES DATA ────────────────────────────── */
const COURSES = [
  { id: 1, title: 'Shoulder & Rotator Cuff Injections', joints: ['Glenohumeral', 'AC Joint', 'Subacromial'], level: 'Advanced', city: 'Coming Soon', country: 'TR', date: 'Coming Soon', cme: 14, price: null, spots: 10, color: T.navy },

  { id: 3, title: 'Upper Extremity Full Course', joints: ['Shoulder', 'Elbow', 'Wrist', 'Hand'], level: 'Intermediate', city: 'Coming Soon', country: 'TR', date: 'Coming Soon', cme: 14, price: null, spots: 10, color: '#097878' },
  { id: 4, title: 'Spine & Axial Procedures', joints: ['Lumbar Facet', 'SI Joint', 'Piriformis'], level: 'Advanced', city: 'Coming Soon', country: 'TR', date: 'Coming Soon', cme: 8, price: null, spots: 10, color: '#1a3060' },
  { id: 5, title: 'MSK Ultrasound Foundations', joints: ['All major joints — diagnostic focus'], level: 'Foundational', city: 'Coming Soon', country: 'TR', date: 'Coming Soon', cme: 16, price: null, spots: 10, color: '#254280' },

const FACULTY = [
  { initials: 'MT', name: 'Assoc. Prof. Dr. Mahir Topaloğlu', title: 'Physical Medicine & Rehabilitation', inst: 'Koç University Hospital', city: 'Istanbul, Turkey', role: 'Faculty' },
  { initials: 'MZ', name: 'Asst. Prof. Dr. Mert Züre', title: 'Physical Medicine & Rehabilitation', inst: 'Kanuni Sultan Süleyman Training & Research Hospital', city: 'Istanbul, Turkey', role: 'Faculty' },
  { initials: 'EE', name: 'Assoc. Prof. Dr. Enes Efe İş', title: 'Physical Medicine & Rehabilitation', inst: 'Şişli Hamidiye Etfal Training & Research Hospital', city: 'Istanbul, Turkey', role: 'Faculty' },
  { initials: 'SS', name: 'Selim Sezikli', title: 'Physical Medicine & Rehabilitation', inst: 'Istanbul Physical Therapy and Rehabilitation Training & Research Hospital', city: 'Istanbul, Turkey', role: 'Faculty' },

/* ── LOGO MARK ───────────────────────────────── */
function LogoMark({ size = 26, color = T.teal, wordColor = T.navy }) {
  const bars = [10, 17, 22, 17, 10].map((h, i) => (
    <div key={i} style={{ width: 3, height: h, background: color, borderRadius: 2, margin: '0 1.5px' }} />
  ));
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer' }}>
      <div style={{ display: 'flex', alignItems: 'center' }}>{bars}</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
        <span style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 700, fontSize: size, color: wordColor, letterSpacing: '-0.02em', lineHeight: 1.1 }}>SonoInjection</span>
        {size <= 20 && <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: T.teal, letterSpacing: '0.04em', opacity: 0.8 }}>sonoinjection.com</span>}
      </div>
    </div>
  );
}

/* ── NAV ─────────────────────────────────────── */
function Nav({ page, setPage }) {
  const dark = page === 'home';
  const bg = dark ? T.navy : '#fff';
  const linkColor = dark ? 'rgba(255,255,255,0.65)' : T.fg2;
  const activeLinkColor = T.teal;
  const links = [['courses','Courses'], ['faculty','Faculty'], ['about','About']];
  return (
    <nav style={{ background: bg, borderBottom: dark ? '1px solid rgba(255,255,255,0.08)' : `1px solid ${T.border}`, padding: '0 48px', height: 64, display: 'flex', alignItems: 'center', justifyContent: 'space-between', position: 'sticky', top: 0, zIndex: 100, boxShadow: dark ? 'none' : '0 1px 4px rgba(12,27,51,0.06)' }}>
      <div onClick={() => setPage('home')} style={{ cursor: 'pointer' }}>
        <LogoMark size={20} color={T.teal} wordColor={dark ? '#fff' : T.navy} />
      </div>
      <div style={{ display: 'flex', gap: 32 }}>
        {links.map(([id, label]) => (
          <button key={id} onClick={() => setPage(id)} style={{ background: 'none', border: 'none', cursor: 'pointer', fontFamily: "'DM Sans',sans-serif", fontSize: 14, fontWeight: 500, color: page === id ? activeLinkColor : linkColor, padding: '4px 0' }}>{label}</button>
        ))}
      </div>
      <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
        {/* Lang switcher */}
        <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 11, color: T.teal, letterSpacing: '0.04em', fontWeight: 600 }}>EN</span>
        <span style={{ color: dark ? 'rgba(255,255,255,0.2)' : T.border, fontSize: 12 }}>|</span>
        <a href="index.html" style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 11, color: dark ? 'rgba(255,255,255,0.35)' : T.fg4, textDecoration: 'none', letterSpacing: '0.04em' }}>TR</a>
        <div style={{ width: 1, height: 20, background: dark ? 'rgba(255,255,255,0.12)' : T.border, margin: '0 4px' }} />
        <button style={{ background: 'none', border: 'none', cursor: 'pointer', fontFamily: "'DM Sans',sans-serif", fontSize: 14, fontWeight: 500, color: dark ? 'rgba(255,255,255,0.6)' : T.fg2 }}>Sign In</button>
        <button onClick={() => setPage('courses')} style={{ background: T.teal, color: '#fff', border: 'none', borderRadius: 8, padding: '9px 20px', fontFamily: "'DM Sans',sans-serif", fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>Register Now</button>
      </div>
    </nav>

}

/* ── WAVE PATTERN ────────────────────────────── */
function WavePattern() {
  return (
    <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', opacity: 0.06 }} preserveAspectRatio="xMidYMid slice">
      <defs>
        <pattern id="waves" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
          <rect x="6" y="0" width="2" height="40" fill="#0aada8"/>
          <rect x="18" y="0" width="2" height="40" fill="#0aada8"/>
          <rect x="30" y="0" width="2" height="40" fill="#0aada8"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#waves)"/>
    </svg>
  );
}

/* ── HOME ────────────────────────────────────── */
function HomePage({ setPage, setSelectedCourse }) {
  return (
    <div>
      {/* Hero */}
      <section style={{ background: T.navy, position: 'relative', overflow: 'hidden', padding: '96px 48px 80px' }}>
        <WavePattern />
        <div style={{ position: 'relative', maxWidth: 1100, margin: '0 auto' }}>
          <div style={{ display: 'inline-flex', alignItems: 'center', gap: 8, background: 'rgba(10,173,168,0.15)', border: '1px solid rgba(10,173,168,0.3)', borderRadius: 999, padding: '5px 14px', marginBottom: 28 }}>
            <div style={{ width: 6, height: 6, borderRadius: '50%', background: T.teal }} />
            <span style={{ fontFamily: "'JetBrains Mono',monospace", fontSize: 11, fontWeight: 500, color: T.teal, letterSpacing: '0.06em' }}>sonoinjection.com</span>
            <span style={{ width: 1, height: 12, background: 'rgba(10,173,168,0.3)' }}></span>
            <span style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 12, fontWeight: 600, color: T.teal, letterSpacing: '0.08em', textTransform: 'uppercase' }}>Cadaver-Based · MSK Ultrasound</span>
          </div>
          <h1 style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 58, fontWeight: 700, color: '#fff', lineHeight: 1.08, letterSpacing: '-0.03em', maxWidth: 680, marginBottom: 24 }}>
            Practice Precision.<br/><span style={{ color: T.teal }}>Build Confidence.</span><br/>Treat with Certainty.
          </h1>
          <p style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 18, color: 'rgba(255,255,255,0.65)', lineHeight: 1.65, maxWidth: 520, marginBottom: 40 }}>
            SonoInjection brings expert faculty and real cadaveric anatomy together to accelerate your ultrasound-guided injection skills across all major joints.
          </p>
          <div style={{ display: 'flex', gap: 14 }}>
            <button onClick={() => setPage('courses')} style={{ background: T.teal, color: '#fff', border: 'none', borderRadius: 10, padding: '14px 32px', fontFamily: "'DM Sans',sans-serif", fontSize: 15, fontWeight: 600, cursor: 'pointer' }}>Browse Courses</button>
            <button onClick={() => setPage('faculty')} style={{ background: 'transparent', color: '#fff', border: '1.5px solid rgba(255,255,255,0.25)', borderRadius: 10, padding: '14px 28px', fontFamily: "'DM Sans',sans-serif", fontSize: 15, fontWeight: 500, cursor: 'pointer' }}>Meet the Faculty</button>
          </div>
        </div>
        {/* Decorative needle */}

      </section>

      {/* Stats bar */}
      <section style={{ background: T.teal, padding: '28px 48px' }}>
        <div style={{ maxWidth: 1100, margin: '0 auto', display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 0 }}>
          {[['4:1','Faculty-to-participant ratio'], ['16','Max participants per course'], ['6+','Joints covered per workshop'], ['100%','Hands-on cadaver time']].map(([n, l]) => (
            <div key={l} style={{ textAlign: 'center', padding: '0 24px', borderRight: '1px solid rgba(255,255,255,0.2)' }}>
              <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 32, fontWeight: 700, color: '#fff', lineHeight: 1 }}>{n}</div>
              <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 12, color: 'rgba(255,255,255,0.75)', marginTop: 4, lineHeight: 1.4 }}>{l}</div>
            </div>
          ))}
        </div>
      </section>

      {/* Featured courses */}
      <section style={{ padding: '72px 48px', background: T.bg }}>
        <div style={{ maxWidth: 1100, margin: '0 auto' }}>
          <div style={{ marginBottom: 40 }}>
            <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, fontWeight: 600, letterSpacing: '0.12em', textTransform: 'uppercase', color: T.teal, marginBottom: 8 }}>Upcoming Dates</div>
            <h2 style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 36, fontWeight: 700, color: T.navy, letterSpacing: '-0.02em' }}>Featured Courses</h2>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 20 }}>

              <CourseCard key={c.id} course={c} onClick={() => { setSelectedCourse(c); setPage('detail'); }} />
            ))}
          </div>
          <div style={{ textAlign: 'center', marginTop: 40 }}>
            <button onClick={() => setPage('courses')} style={{ background: 'transparent', color: T.teal, border: `1.5px solid ${T.teal}`, borderRadius: 8, padding: '11px 28px', fontFamily: "'DM Sans',sans-serif", fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>View All Courses →</button>
          </div>
        </div>
      </section>

      {/* Faculty teaser */}
      <section style={{ padding: '72px 48px', background: '#fff' }}>
        <div style={{ maxWidth: 1100, margin: '0 auto' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', marginBottom: 40 }}>
            <div>
              <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, fontWeight: 600, letterSpacing: '0.12em', textTransform: 'uppercase', color: T.teal, marginBottom: 8 }}>Expert Instructors</div>
              <h2 style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 36, fontWeight: 700, color: T.navy, letterSpacing: '-0.02em' }}>Meet the Faculty</h2>
            </div>
            <button onClick={() => setPage('faculty')} style={{ background: 'none', border: 'none', color: T.teal, fontFamily: "'DM Sans',sans-serif", fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>All Faculty →</button>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 16 }}>
            {FACULTY.slice(0,4).map(f => <FacultyCard key={f.initials} faculty={f} />)}
          </div>
        </div>
      </section>

      {/* CTA */}
      <section style={{ background: T.navy, padding: '72px 48px', position: 'relative', overflow: 'hidden' }}>
        <WavePattern />
        <div style={{ maxWidth: 1100, margin: '0 auto', position: 'relative', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <h2 style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 36, fontWeight: 700, color: '#fff', letterSpacing: '-0.02em', marginBottom: 12 }}>Ready to elevate your practice?</h2>
            <p style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 16, color: 'rgba(255,255,255,0.6)', maxWidth: 460 }}>Join clinicians from Turkey, Germany, Austria and beyond at the next SonoInjection cadaver workshop.</p>

          <button onClick={() => setPage('courses')} style={{ background: T.amber, color: T.navy, border: 'none', borderRadius: 10, padding: '16px 36px', fontFamily: "'DM Sans',sans-serif", fontSize: 15, fontWeight: 700, cursor: 'pointer', flexShrink: 0 }}>Register for a Course</button>

/* ── COURSE CARD ─────────────────────────────── */
function CourseCard({ course: c, onClick }) {
  const [hov, setHov] = useState(false);
  const full = c.spots === 0;
  return (
    <div onClick={onClick} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{ background: '#fff', border: `1px solid ${T.border}`, borderRadius: 12, overflow: 'hidden', cursor: 'pointer', boxShadow: hov ? '0 8px 32px rgba(12,27,51,0.14)' : '0 2px 12px rgba(12,27,51,0.07)', transform: hov ? 'translateY(-2px)' : 'none', transition: 'all 200ms ease' }}>
      <div style={{ background: c.color, height: 88, display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative', overflow: 'hidden' }}>
        <div style={{ position: 'absolute', inset: 0, backgroundImage: 'repeating-linear-gradient(0deg, transparent, transparent 5px, rgba(10,173,168,0.15) 5px, rgba(10,173,168,0.15) 6px)' }} />
        <span style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 18, fontWeight: 700, color: T.teal, zIndex: 1, textAlign: 'center', padding: '0 16px' }}>{c.title.split(' ').slice(0,2).join(' ')}</span>
      </div>
      <div style={{ padding: 20 }}>
        <div style={{ display: 'flex', gap: 6, marginBottom: 10, flexWrap: 'wrap' }}>
          <span style={{ background: T.tealLight, color: T.teal, border: `1px solid ${T.tealBorder}`, borderRadius: 999, fontSize: 10, fontWeight: 600, padding: '2px 9px' }}>{c.level}</span>
          {full && <span style={{ background: '#fee2e2', color: '#dc2626', border: '1px solid #fecaca', borderRadius: 999, fontSize: 10, fontWeight: 600, padding: '2px 9px' }}>Full</span>}
          {!full && c.spots <= 4 && <span style={{ background: '#fdf1e0', color: '#b8660e', border: '1px solid #fae4bf', borderRadius: 999, fontSize: 10, fontWeight: 600, padding: '2px 9px' }}>{c.spots} spots left</span>}
        </div>
        <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 15, fontWeight: 600, color: T.navy, marginBottom: 8, lineHeight: 1.3 }}>{c.title}</div>
        <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 12, color: T.fg3, lineHeight: 1.5 }}>
          📍 {c.city} &nbsp;·&nbsp; {c.date}
        </div>
      </div>
      <div style={{ padding: '12px 20px', borderTop: `1px solid ${T.border}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <span style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 16, fontWeight: 700, color: T.navy }}>{c.price ? `₺ ${c.price.toLocaleString('tr-TR')}` : 'Coming Soon'}</span>
        <button style={{ background: full ? T.muted : T.teal, color: full ? T.fg4 : '#fff', border: 'none', borderRadius: 7, padding: '7px 14px', fontFamily: "'DM Sans',sans-serif", fontSize: 12, fontWeight: 600, cursor: full ? 'not-allowed' : 'pointer' }}>{full ? 'Join Waitlist' : 'Enroll →'}</button>
      </div>
    </div>
  );
}

/* ── FACULTY CARD ────────────────────────────── */
function FacultyCard({ faculty: f }) {
  const colors = [T.teal, '#3359a5', '#097878', '#254280', T.navy2, T.navy3];
  const bg = colors[f.initials.charCodeAt(0) % colors.length];
  return (
    <div style={{ background: '#fff', border: `1px solid ${T.border}`, borderRadius: 12, padding: '24px 16px', textAlign: 'center', boxShadow: '0 2px 12px rgba(12,27,51,0.06)' }}>
      <div style={{ width: 60, height: 60, borderRadius: '50%', background: bg, margin: '0 auto 12px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: "'Space Grotesk',sans-serif", fontWeight: 700, fontSize: 20, color: '#fff' }}>{f.initials}</div>
      <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 13, fontWeight: 600, color: T.navy, marginBottom: 4, lineHeight: 1.3 }}>{f.name}</div>
      <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, color: T.fg3, lineHeight: 1.5, marginBottom: 8 }}>{f.title}<br/>{f.inst}{f.city ? <><br/>{f.city}</> : null}</div>
      <span style={{ background: f.role === 'Course Director' ? T.navy : T.muted, color: f.role === 'Course Director' ? '#fff' : T.fg2, borderRadius: 999, fontSize: 10, fontWeight: 600, padding: '3px 10px' }}>{f.role}</span>
    </div>
  );
}

/* ── COURSES PAGE ────────────────────────────── */
function CoursesPage({ setPage, setSelectedCourse }) {
  const [filter, setFilter] = useState('All');
  const levels = ['All', 'Foundational', 'Intermediate', 'Advanced'];
  const filtered = filter === 'All' ? COURSES : COURSES.filter(c => c.level === filter);
  return (
    <div style={{ minHeight: '100vh', background: T.bg }}>
      <div style={{ background: T.navy, padding: '48px 48px 40px' }}>
        <div style={{ maxWidth: 1100, margin: '0 auto' }}>
          <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 11, fontWeight: 600, letterSpacing: '0.12em', textTransform: 'uppercase', color: T.teal, marginBottom: 8 }}>All Courses</div>
          <h1 style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 42, fontWeight: 700, color: '#fff', letterSpacing: '-0.02em', marginBottom: 24 }}>Upcoming Workshops</h1>
          <div style={{ display: 'flex', gap: 8 }}>
            {levels.map(l => (
              <button key={l} onClick={() => setFilter(l)} style={{ background: filter === l ? T.teal : 'rgba(255,255,255,0.08)', color: filter === l ? '#fff' : 'rgba(255,255,255,0.6)', border: 'none', borderRadius: 999, padding: '7px 18px', fontFamily: "'DM Sans',sans-serif", fontSize: 13, fontWeight: 500, cursor: 'pointer', transition: 'all 150ms' }}>{l}</button>
            ))}
          </div>
        </div>
      </div>
      <div style={{ maxWidth: 1100, margin: '0 auto', padding: '40px 48px' }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 20 }}>
          {filtered.map(c => <CourseCard key={c.id} course={c} onClick={() => { setSelectedCourse(c); setPage('detail'); }} />)}
        </div>
        {filtered.length === 0 && <div style={{ textAlign: 'center', padding: '48px 0', color: T.fg3, fontFamily: "'DM Sans',sans-serif" }}>No courses at this level currently scheduled.</div>}
      </div>
      <Footer />
    </div>
  );
}

/* ── COURSE DETAIL ───────────────────────────── */

    { time: '12:30–13:30', title: 'Lunch & Faculty Q&A', type: 'admin' },
    { time: '13:30–15:30', title: 'Station 2 — Hip & Groin', type: 'cadaver' },
    { time: '15:45–17:30', title: 'Station 3 — Knee & Ankle', type: 'cadaver' },
    { time: '17:30–18:00', title: 'Debrief & Certificate Distribution', type: 'admin' },

  const typeColors = { lecture: T.tealLight, cadaver: '#dde6f5', admin: T.muted };
  const typeText = { lecture: T.teal, cadaver: T.navy, admin: T.fg3 };
  return (
    <div style={{ background: T.bg, minHeight: '100vh' }}>
      <div style={{ background: T.navy, padding: '48px 48px 40px', position: 'relative', overflow: 'hidden' }}>

        <div style={{ maxWidth: 1100, margin: '0 auto', position: 'relative' }}>

        {/* Sidebar */}
        <div>

            <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 34, fontWeight: 700, color: T.navy, marginBottom: 4 }}>{c.price ? `₺ ${c.price.toLocaleString('tr-TR')}` : 'Coming Soon'}</div>
            <div style={{ fontFamily: "'DM Sans',sans-serif", fontSize: 13, color: T.fg3, marginBottom: 24 }}>per participant · VAT included</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 24 }}>
              {[['📅', c.date], ['📍', `${c.city}`], ['👥', `Max 16 participants`], ['⏱', `Full day · 08:00–18:00`]].map(([icon, text]) => (
                <div key={text} style={{ display: 'flex', gap: 10, alignItems: 'center' }}>

              {c.spots === 0 ? 'Join Waitlist' : 'Enroll Now'}

            {c.spots > 0 && <button style={{ width: '100%', background: 'transparent', color: T.teal, border: `1.5px solid ${T.teal}`, borderRadius: 10, padding: '13px 0', fontFamily: "'DM Sans',sans-serif", fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>Request Invoice</button>}

      <Footer />
    </div>

}

/* ── APP ─────────────────────────────────────── */
function App() {
  const [page, setPage] = useState('home');
  const [selectedCourse, setSelectedCourse] = useState(null);

  const renderPage = () => {
    switch (page) {
      case 'home':    return <HomePage setPage={setPage} setSelectedCourse={setSelectedCourse} />;
      case 'courses': return <CoursesPage setPage={setPage} setSelectedCourse={setSelectedCourse} />;
      case 'detail':  return <CourseDetailPage course={selectedCourse} setPage={setPage} />;
      case 'faculty': return <FacultyPage />;
      case 'about':   return <AboutPage />;
      default:        return <HomePage setPage={setPage} setSelectedCourse={setSelectedCourse} />;
    }
  };

  useEffect(() => { window.scrollTo({ top: 0 }); }, [page]);

  return (
    <div>
      <Nav page={page} setPage={setPage} />
      {renderPage()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
