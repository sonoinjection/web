<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yönetici Paneli — SonoInjection Kayıt</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

  <link rel="stylesheet" href="/kayit/styles/tokens.css" />
  <link rel="stylesheet" href="/kayit/styles/base.css" />
  <link rel="stylesheet" href="/kayit/styles/components.css" />
</head>
<body>

<!-- ── MOCK BANNER ──────────────────────────────── -->
<div class="mock-banner" role="status">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
  <span><strong>Mock modu</strong> — Google OAuth Vercel geçişinden sonra eklenecek.</span>
</div>

<!-- ── HEADER ───────────────────────────────────── -->
<header class="site-header">
  <div class="site-header__inner">
    <a class="logo" href="/kayit/" aria-label="SonoInjection kayıt sayfası">
      <span class="logo__bars" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </span>
      <span class="logo__word">SonoInjection · Yönetici</span>
    </a>
    <a class="site-header__back" href="/kayit/">← Kayıt sayfasına dön</a>
  </div>
</header>

<!-- ── ADMIN BODY ───────────────────────────────── -->
<section class="section section--tight">
  <div class="container">

    <div class="admin-head">
      <div class="eyebrow">Başvurular</div>
      <h1 class="admin-head__title">Kayıt Yönetimi</h1>
    </div>

    <div class="admin-event-select">
      <label class="form-label" for="admin-event-select">Etkinlik</label>
      <select class="form-select" id="admin-event-select" data-event-select>
        <option value="">Yükleniyor…</option>
      </select>
    </div>

    <div data-event-panel></div>

    <div class="admin-stats" data-stats></div>

    <div class="filter-bar">
      <div class="filter-bar__field">
        <span class="filter-bar__label">Durum</span>
        <div class="filter-status" data-filter-status>
          <label class="filter-status__option"><input type="checkbox" value="applied" checked /> <span>Başvurdu</span></label>
          <label class="filter-status__option"><input type="checkbox" value="paid" checked /> <span>Ödendi</span></label>
          <label class="filter-status__option"><input type="checkbox" value="cancelled" checked /> <span>İptal</span></label>
          <label class="filter-status__option"><input type="checkbox" value="refunded" checked /> <span>İade</span></label>
        </div>
      </div>
      <div class="filter-bar__field" style="flex:1; min-width: 200px; max-width: 360px;">
        <label class="filter-bar__label" for="filter-search">Ara (ad, e-posta, kurum)</label>
        <input class="filter-bar__input" id="filter-search" type="search" data-filter-search placeholder="Ara…" />
      </div>
      <div class="filter-bar__count" data-row-count>—</div>
    </div>

    <div class="table-wrap">
      <div class="table-scroll">
        <table class="table">
          <thead>
            <tr>
              <th>Ad Soyad</th>
              <th>E-posta</th>
              <th>Telefon</th>
              <th>Uzmanlık</th>
              <th>Pozisyon</th>
              <th>Kurum</th>
              <th>Durum</th>
              <th>Kayıt Tarihi</th>
            </tr>
          </thead>
          <tbody data-table-body>
            <tr><td colspan="8" class="table-empty">Yükleniyor…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</section>

<!-- ── DETAIL MODAL ─────────────────────────────── -->
<div class="modal" data-detail-modal>
  <div class="modal__panel" data-detail-content></div>
</div>

<!-- ── ACTION DIALOG ────────────────────────────── -->
<div class="modal modal--dialog" data-action-dialog>
  <div class="modal__panel modal__panel--dialog" data-action-dialog-content></div>
</div>

<!-- ── TOAST ────────────────────────────────────── -->
<div class="toast-container" data-toast-container></div>

<!-- ── FOOTER ──────────────────────────────────── -->
<footer class="site-footer">
  <div class="site-footer__inner">
    <span>© 2026 SonoInjection — Tüm hakları saklıdır.</span>
    <a href="https://sonoinjection.com">sonoinjection.com</a>
  </div>
</footer>

<script type="module" src="/kayit/scripts/admin.js"></script>

</body>
</html>
